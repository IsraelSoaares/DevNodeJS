<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Todo List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .container {
      width: 400px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background: #4caf50;
      color: #fff;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    li.concluida span {
      text-decoration: line-through;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Todo List</h1>

    <form id="form">
      <input
        type="text"
        id="nome_tarefa"
        placeholder="Digite sua tarefa..."
      />
      <button type="submit">Adicionar</button>
    </form>

    <ul id="lista"></ul>
  </div>

  <script>
  const API_URL = 'http://localhost:9090/api'

  const form = document.getElementById('form')
  const input = document.getElementById('nome_tarefa')
  const lista = document.getElementById('lista')

  // 🔄 Carregar tarefas
  async function carregarTarefas() {
    const res = await fetch(`${API_URL}/tasks`)
    const tarefas = await res.json()

    lista.innerHTML = ''

    tarefas.forEach(tarefa => {
      const li = document.createElement('li')

      if (tarefa.tarefa_concluida === 1) {
        li.classList.add('concluida')
      }

      // Checkbox
      const checkbox = document.createElement('input')
      checkbox.type = 'checkbox'
      checkbox.checked = tarefa.tarefa_concluida === 1

      checkbox.addEventListener('change', async () => {
        await atualizarStatus(tarefa.id, checkbox.checked)

        if(checkbox.checked){
          li.classList.add('concluida')
        }else{
          li.classList.remove('concluida')
        }
      })

      // Texto
      const span = document.createElement('span')
      span.textContent = tarefa.nome_tarefa

      // Botão delete 🗑️
      const btnDelete = document.createElement('button')
      btnDelete.textContent = '🗑️'
      btnDelete.style.marginLeft = 'auto'
      btnDelete.style.background = 'transparent'
      btnDelete.style.border = 'none'
      btnDelete.style.cursor = 'pointer'
      btnDelete.style.fontSize = '18px'

      btnDelete.addEventListener('click', () => {
        deletarTarefa(tarefa.id)
      })

      li.appendChild(checkbox)
      li.appendChild(span)
      li.appendChild(btnDelete)

      lista.appendChild(li)
    })
  }

  // ➕ Criar tarefa
  form.addEventListener('submit', async (e) => {
    e.preventDefault()

    if (!input.value) return

    await fetch(`${API_URL}/tasks`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        nome_tarefa: input.value
      })
    })

    input.value = ''
    carregarTarefas()
  })

  // ✅ Atualizar status
  async function atualizarStatus(id, concluida) {
    await fetch(`${API_URL}/tasks/${id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        tarefa_concluida: concluida ? 1 : 0
      })
    })
  }

  // 🗑️ Deletar tarefa
  async function deletarTarefa(id) {
    const confirmar = confirm('Deseja deletar essa tarefa?')
    if (!confirmar) return

    await fetch(`${API_URL}/tasks/${id}`, {
      method: 'DELETE'
    })

    carregarTarefas()
  }

  carregarTarefas()
</script>


</body>
</html>
